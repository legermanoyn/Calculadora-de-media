html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculadora de Média</title>

    <link rel="stylesheet" href="style.css">

    <script src="script.js" defer></script>

</head>

<body>

    <main class="calculator">

        <header>

            <div class="icon">∑</div>

            <div>

                <p class="eyebrow">FERRAMENTA DO ESTUDANTE</p>

                <h1>Calculadora de média</h1>

            </div>

        </header>

        <p class="description">

            Informe suas notas para descobrir sua média final.

        </p>

        <form id="gradeForm">

            <label for="grade1">

                Nota do 1º período

                <span>0 a 10</span>

            </label>

            <input

                id="grade1"

                type="number"

                min="0"

                max="10"

                step="0.1"

                placeholder="Ex.: 7,5"

                required

            >

            <label for="grade2">

                Nota do 2º período

                <span>0 a 10</span>

            </label>

            <input

                id="grade2"

                type="number"

                min="0"

                max="10"

                step="0.1"

                placeholder="Ex.: 8,0"

                required

            >

            <label for="grade3">

                Nota do 3º período

                <span>0 a 10</span>

            </label>

            <input

                id="grade3"

                type="number"

                min="0"

                max="10"

                step="0.1"

                placeholder="Ex.: 6,5"

                required

            >

            <button type="submit">

                Calcular média

            </button>

        </form>

        <section id="result" class="result">

            <span class="result-label">SUA MÉDIA</span>

            <strong id="average">—</strong>

            <p id="message">

                Preencha as notas para ver o resultado.

            </p>

        </section>

        <p class="note">

            Média 7,0 para aprovação neste exemplo.

        </p>

    </main>

</body>

</html>
